name: Atualizar Troféus

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

jobs:
  gerar-trofeus:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Gerar troféus
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=tokyonight&column=7&margin-w=15&margin-h=15&no-bg=true&no-frame=true'
          path: .github/assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar troféus no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy.svg
          git commit -m "chore: atualizar troféus" || exit 0
          git push
